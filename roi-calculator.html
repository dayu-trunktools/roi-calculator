<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trunk Tools — ROI Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-root:      #0e1117;
      --bg-surface:   #151921;
      --bg-card:      #1a1f2b;
      --bg-elevated:  #222837;
      --bg-input:     #111520;
      --border:       #313848;
      --border-light: #2a3040;
      --border-focus: #f5c542;
      --text-primary: #f0f2f5;
      --text-secondary:#b0b8cc;
      --text-muted:   #8b95ab;
      --accent:       #f5c542;
      --accent-hover: #f7d06a;
      --accent-muted: rgba(245,197,66,0.12);
      --accent-glow:  rgba(245,197,66,0.22);
      --accent-text:  #1a1400;
      --blue:         #6db3ff;
      --blue-muted:   rgba(109,179,255,0.14);
      --green:        #4aedb5;
      --green-muted:  rgba(74,237,181,0.12);
      --purple:       #c0adff;
      --purple-muted: rgba(192,173,255,0.12);
      --red:          #ff7070;
      --red-muted:    rgba(255,112,112,0.12);
      --orange:       #ff8c42;
      --orange-muted: rgba(255,140,66,0.14);
      --cyan:         #22d3ee;
      --cyan-muted:   rgba(34,211,238,0.12);
      --yellow:       #fbbf24;
      --font-body:    'DM Sans', -apple-system, sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      --radius-sm:    6px;
      --radius-md:    10px;
      --radius-lg:    14px;
      --radius-xl:    20px;
      --shadow-card:  0 1px 3px rgba(0,0,0,0.3), 0 0 0 1px var(--border);
      --transition:   180ms ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg-root);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    input, select, textarea, button { font-family: var(--font-body); }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 0.3; }
    input[type="range"] {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
      transition: transform var(--transition);
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulseGlow { 0%,100% { box-shadow:0 0 12px var(--accent-glow); } 50% { box-shadow:0 0 24px var(--accent-glow); } }
    .fade-in { animation: fadeIn 350ms ease both; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

/* ─── Formatters ──────────────────────────────────────────── */
const formatCurrency = (v) => {
  if (!v || isNaN(v)) return '$0';
  if (v >= 1e9) return `$${(v/1e9).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})}B`;
  if (v >= 1e6) return `$${(v/1e6).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})}M`;
  if (v >= 1e3) return `$${(v/1e3).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}K`;
  return `$${v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0})}`;
};
const formatNumber = (v) => new Intl.NumberFormat('en-US').format(Math.round(v||0));

/* ─── Defaults ────────────────────────────────────────────── */
const ROI_DEFAULTS = {
  global:         { valueCaptureRate: 0.10 },
  trunktext:      { fieldUsersPerProject:7, searchesPerDay:2, currentSearchTime:20, trunkTextSearchTime:1, loadedLaborCost:80, workingDaysPerYear:250, riskAvoidanceEnabled:false, pctSearchesWithWrongInfo:0.04, pctPreventedByTrunkText:0.65, avgCostPerIncident:3500 },
  trunksubmittal: { submittalsPerYear:2000, hoursPerReview:0.75, timeReductionPct:0.80, reviewerCost:100, reworkRate:0.04, pctReworkFromErrors:0.30, pctErrorsCaught:0.40 },
  trunkreview:    { drawingSetsPerYear:24, hoursPerReview:8, timeReductionPct:0.75, reviewerCost:100, uncloudedChangesPerSet:8, pctCaughtByTrunkReview:0.85, pctChangesWithCostImpact:0.50, avgCostPerMissedChange:15000 },
  trunkrfi:       { rfisPerYear:200, hoursPerRFI:1, timeReductionPct:0.80, pmCost:100, pctUnnecessary:0.05 }
};

/* ─── Deployment Config ───────────────────────────────────── */
// Set DEPLOY_URL to your hosted URL so Share links work for anyone worldwide.
// Example: 'https://yourname.github.io/roi-calc/roi-calculator.html'
// Leave blank when serving from a real web server (uses window.location automatically).
const DEPLOY_URL  = 'https://dayu-trunktools.github.io/roi-calculator/roi-calculator.html';
const JBIN_KEY    = '$2a$10$E8IGGmDkX03Owl7F5Cgs1ucHMxzJ3gHDJuuEzoPHndmx3eoupmPBG';
const JBIN_API    = 'https://api.jsonbin.io/v3/b';
const JBIN_COLL   = 'https://api.jsonbin.io/v3/c/uncategorized/bins'; // lists all bins (source of truth for Saved Cases)
const JBIN_INDEX  = '6a024742250b1311c336ee8e'; // legacy index bin — filtered out of the case list

/* ─── URL encode / decode ─────────────────────────────────── */
const encodeState = (s) => {
  try {
    const payload = { co:s.companyName, n:s.numProjects, a:s.avgProjectSizeM, p:s.enabledProducts, ri:s.roiInputs };
    const hash = `#s=${btoa(JSON.stringify(payload))}`;
    const isLocal = window.location.protocol === 'file:';
    const base = DEPLOY_URL || (isLocal ? '' : `${window.location.origin}${window.location.pathname}`);
    return base ? `${base}${hash}` : hash;
  } catch { return window.location.href; }
};
const decodeState = () => {
  try {
    const m = window.location.hash.match(/#s=(.+)/);
    if (!m) return null;
    const d = JSON.parse(atob(m[1]));
    return {
      companyName:     d.co || '',
      numProjects:     d.n  || 10,
      avgProjectSizeM: d.a  || 20,
      enabledProducts: { trunktext:true, trunksubmittal:true, trunkreview:false, trunkrfi:false, ...(d.p||{}) },
      roiInputs:       { global:{...ROI_DEFAULTS.global,...(d.ri?.global||{})}, trunktext:{...ROI_DEFAULTS.trunktext,...(d.ri?.trunktext||{})}, trunksubmittal:{...ROI_DEFAULTS.trunksubmittal,...(d.ri?.trunksubmittal||{})}, trunkreview:{...ROI_DEFAULTS.trunkreview,...(d.ri?.trunkreview||{})}, trunkrfi:{...ROI_DEFAULTS.trunkrfi,...(d.ri?.trunkrfi||{})} }
    };
  } catch { return null; }
};

/* ─── InfoTooltip ─────────────────────────────────────────── */
function InfoTooltip({ text }) {
  const [show, setShow] = useState(false);
  const [pos,  setPos]  = useState({ top:0, left:0 });
  const btnRef = useRef(null);
  const update = () => {
    if (!btnRef.current) return;
    const r   = btnRef.current.getBoundingClientRect();
    const tipW = 320;
    let left    = r.left + r.width/2 - tipW/2;
    if (left < 8) left = 8;
    if (left + tipW > window.innerWidth - 8) left = window.innerWidth - tipW - 8;
    const above = r.top - 8;
    if (above > 200) setPos({ bottom: window.innerHeight - r.top + 8, top:'auto', left });
    else             setPos({ top: r.bottom + 8, bottom:'auto', left });
  };
  return (
    <span style={{ display:'inline-flex', marginLeft:6 }}>
      <button ref={btnRef} type="button"
        onMouseEnter={()=>{update();setShow(true);}} onMouseLeave={()=>setShow(false)}
        onFocus={()=>{update();setShow(true);}}      onBlur={()=>setShow(false)}
        style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', width:17, height:17, borderRadius:'50%', background:'var(--border)', color:'var(--text-muted)', fontSize:9, fontWeight:700, fontFamily:'var(--font-mono)', border:'none', cursor:'help', padding:0 }}>
        ?
      </button>
      {show && ReactDOM.createPortal(
        <div style={{ position:'fixed', top:pos.top!=='auto'?pos.top:undefined, bottom:pos.bottom!=='auto'?pos.bottom:undefined, left:pos.left, padding:'10px 14px', background:'var(--bg-elevated)', color:'var(--text-secondary)', fontSize:12, borderRadius:'var(--radius-md)', width:320, zIndex:9999, boxShadow:'0 8px 32px rgba(0,0,0,0.4)', lineHeight:1.5, border:'1px solid var(--border)', pointerEvents:'none' }}>
          {text}
        </div>,
        document.body
      )}
    </span>
  );
}

/* ─── CalcBreakdown ───────────────────────────────────────── */
function CalcBreakdown({ label, steps, total, color }) {
  const lineStyle = { display:'flex', justifyContent:'space-between', alignItems:'center', padding:'3px 0', fontSize:12, fontFamily:'var(--font-mono)' };
  return (
    <div style={{ background:'var(--bg-root)', borderRadius:'var(--radius-md)', padding:'12px 16px', marginTop:8, border:'1px solid var(--border-light)' }}>
      {label && <div style={{ fontSize:10, fontWeight:700, color:color||'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:8 }}>{label}</div>}
      {steps.map((s,i) => (
        <div key={i} style={{ ...lineStyle, color:'var(--text-secondary)', borderBottom:s.divider?'1px solid var(--border-light)':'none', paddingBottom:s.divider?6:3, marginBottom:s.divider?6:0 }}>
          <span style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:14, textAlign:'right', color:'var(--text-muted)', fontSize:11 }}>{s.op||''}</span>
            <span>{s.label}</span>
          </span>
          <span style={{ fontWeight:500 }}>{s.value}</span>
        </div>
      ))}
      {total && (
        <div style={{ ...lineStyle, color:color||'var(--accent)', fontWeight:700, borderTop:'1px solid var(--border)', paddingTop:6, marginTop:4 }}>
          <span style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ width:14, textAlign:'right', fontSize:11 }}>=</span>
            <span>{total.label}</span>
          </span>
          <span>{total.value}</span>
        </div>
      )}
    </div>
  );
}

/* ─── PSlider ─────────────────────────────────────────────── */
function PSlider({ label, value, onChange, min, max, step=1, prefix, suffix, color, tooltip }) {
  const pct = ((value-min)/(max-min))*100;
  const accentColor = color||'var(--accent)';
  const id = useRef(`sl-${Math.random().toString(36).slice(2)}`).current;
  const display = `${prefix||''}${typeof value==='number'&&value%1!==0?value.toFixed(1):value}${suffix||''}`;
  return (
    <div style={{ padding:'10px 0', borderBottom:'1px solid var(--border-light)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
        <label htmlFor={id} style={{ fontSize:13, color:'var(--text-secondary)', display:'flex', alignItems:'center' }}>
          {label}{tooltip && <InfoTooltip text={tooltip}/>}
        </label>
        <span style={{ fontSize:14, fontWeight:700, color:'var(--text-primary)', fontFamily:'var(--font-mono)' }}>{display}</span>
      </div>
      <div style={{ position:'relative', height:6, background:'var(--bg-root)', borderRadius:3 }}>
        <div style={{ position:'absolute', top:0, left:0, height:'100%', width:`${pct}%`, background:accentColor, borderRadius:3, transition:'width 0.1s' }}/>
        <input id={id} type="range" min={min} max={max} step={step} value={value}
          onChange={e=>onChange(parseFloat(e.target.value))}
          style={{ position:'absolute', top:-6, left:0, width:'100%', height:18, opacity:0, cursor:'pointer', margin:0 }}/>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', marginTop:4 }}>
        <span style={{ fontSize:10, color:'var(--text-muted)', fontFamily:'var(--font-mono)' }}>{prefix||''}{min}{suffix||''}</span>
        <span style={{ fontSize:10, color:'var(--text-muted)', fontFamily:'var(--font-mono)' }}>{prefix||''}{max}{suffix||''}</span>
      </div>
    </div>
  );
}

/* ─── StatBox ─────────────────────────────────────────────── */
function StatBox({ label, value, sub, color, style:sx }) {
  return (
    <div style={{ background:'var(--bg-elevated)', borderRadius:'var(--radius-md)', padding:'16px 20px', border:'1px solid var(--border-light)', ...sx }}>
      <div style={{ fontSize:11, fontWeight:600, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:6 }}>{label}</div>
      <div style={{ fontSize:24, fontWeight:700, color:color||'var(--text-primary)', fontFamily:'var(--font-mono)', letterSpacing:'-0.02em' }}>{value}</div>
      {sub && <div style={{ fontSize:12, color:'var(--text-muted)', marginTop:4 }}>{sub}</div>}
    </div>
  );
}

/* ─── NumBox (portfolio inputs) ───────────────────────────── */
function NumBox({ label, value, onChange, prefix, suffix, min=1, step=1, tooltip }) {
  const id = useRef(`nb-${Math.random().toString(36).slice(2)}`).current;
  return (
    <div>
      <label htmlFor={id} style={{ display:'flex', alignItems:'center', fontSize:11, fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:6 }}>{label}{tooltip && <InfoTooltip text={tooltip}/>}</label>
      <div style={{ display:'flex', alignItems:'center', gap:5, background:'var(--bg-elevated)', borderRadius:'var(--radius-md)', border:'1px solid var(--border)', padding:'8px 14px', transition:'border-color var(--transition)' }}
        onFocusCapture={e=>e.currentTarget.style.borderColor='var(--accent)'}
        onBlurCapture={e=>e.currentTarget.style.borderColor='var(--border)'}>
        {prefix && <span style={{ fontSize:14, color:'var(--text-muted)', fontFamily:'var(--font-mono)', flexShrink:0 }}>{prefix}</span>}
        <input id={id} type="number" value={value} min={min} step={step}
          onChange={e=>onChange(Math.max(min, +e.target.value||0))}
          style={{ flex:1, background:'transparent', border:'none', color:'var(--text-primary)', fontSize:18, fontWeight:700, fontFamily:'var(--font-mono)', outline:'none', minWidth:0, textAlign:'center' }}/>
        {suffix && <span style={{ fontSize:13, color:'var(--text-muted)', fontFamily:'var(--font-mono)', flexShrink:0 }}>{suffix}</span>}
      </div>
    </div>
  );
}

/* ─── PDF Generator ───────────────────────────────────────── */
const generatePDF = (companyName, numProjects, avgProjectSizeM, roiCalc, roiInputs, enabledProducts) => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'letter' });
  const W = 215.9, H = 279.4, mx = 20, cw = W - mx*2;
  let y = 0;

  // Drawing helpers
  const sf  = (sz,st='normal',col=[28,40,72]) => { doc.setFontSize(sz); doc.setFont('helvetica',st); doc.setTextColor(...col); };
  const txt = (s,x,yy,opts={}) => doc.text(String(s),x,yy,opts);
  const ln  = (x1,y1,x2,y2,col=[205,212,228],lw=0.25) => { doc.setDrawColor(...col); doc.setLineWidth(lw); doc.line(x1,y1,x2,y2); };
  const fr  = (x,yy,w,h,fill) => { doc.setFillColor(...fill); doc.rect(x,yy,w,h,'F'); };
  const frr = (x,yy,w,h,r,fill,stroke) => {
    doc.setFillColor(...fill); doc.roundedRect(x,yy,w,h,r,r,'F');
    if (stroke) { doc.setDrawColor(...stroke); doc.setLineWidth(0.4); doc.roundedRect(x,yy,w,h,r,r,'S'); }
  };

  const today = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const co    = companyName || 'Your Portfolio';
  const activeProds  = Object.keys(enabledProducts).filter(k=>enabledProducts[k]);
  const prodLabels   = { trunktext:'TrunkText', trunksubmittal:'TrunkSubmittal', trunkreview:'TrunkReview', trunkrfi:'TrunkRFI' };
  const prodColors   = { trunktext:[73,159,255], trunksubmittal:[255,140,66], trunkreview:[150,117,255], trunkrfi:[34,211,238] };
  const prodDesc     = {
    trunktext:      'AI document search — labor recovered from manual look-ups',
    trunksubmittal: 'Submittal review automation — labor savings + rework avoidance',
    trunkreview:    'Drawing comparison — labor savings + missed change detection',
    trunkrfi:       'Autonomous RFI agent — labor savings + unnecessary RFI cost avoidance'
  };

  const drawPageHeader = () => {
    fr(0,0,W,40,[10,14,26]);
    // Logo: yellow box with T
    frr(mx,8,24,24,3,[245,197,66]);
    sf(13,'bold',[14,14,14]); txt('T',mx+12,23,{align:'center'});
    // Wordmark
    sf(13,'bold',[232,238,252]); txt('Trunk Tools',mx+30,17);
    sf(7,'normal',[118,136,168]); txt('ROI ANALYSIS',mx+30,24);
    // Right: company + date
    if (companyName) {
      sf(11,'bold',[232,238,252]); txt(co,W-mx,17,{align:'right'});
      sf(7.5,'normal',[128,148,178]); txt(today,W-mx,24.5,{align:'right'});
    } else {
      sf(8,'normal',[128,148,178]); txt(today,W-mx,20,{align:'right'});
    }
    // Yellow accent strip
    fr(0,40,W,2.5,[245,197,66]);
  };

  const drawPageFooter = (pg,total) => {
    fr(0,H-16,W,16,[10,14,26]);
    fr(0,H-17.5,W,1.5,[245,197,66]);
    sf(6.5,'normal',[108,128,158]);
    txt('Trunk Tools  ·  trunktools.com',mx,H-7.5);
    txt(`Generated ${today}  ·  Confidential & Proprietary`,W/2,H-7.5,{align:'center'});
    txt(`Page ${pg} of ${total}`,W-mx,H-7.5,{align:'right'});
    sf(5.5,'normal',[80,98,128]);
    txt('Values are estimates based on industry benchmarks and configurable assumptions. Actual results may vary.',mx,H-3.5);
  };

  // ── PAGE 1 ──────────────────────────────────────────────
  drawPageHeader();
  y = 50;

  // Title
  sf(21,'bold',[12,18,44]); txt('Return on Investment Analysis',mx,y); y += 8;
  sf(9,'normal',[92,108,140]);
  txt(`${numProjects} active project${numProjects!==1?'s':''} · $${avgProjectSizeM}M average project size · Trunk Tools platform`,mx,y);
  y += 6; ln(mx,y,W-mx,y,[198,208,228],0.5); y += 10;

  // Hero metric boxes
  const hw = (cw-10)/2;
  frr(mx,y,hw,40,3,[235,252,243],[42,196,136]);
  sf(7,'bold',[18,118,76]); txt('ESTIMATED ANNUAL VALUE',mx+hw/2,y+8.5,{align:'center'});
  sf(21,'bold',[16,138,86]); txt(formatCurrency(roiCalc.totalAnnual),mx+hw/2,y+23,{align:'center'});
  sf(7,'normal',[32,148,100]); txt(`${formatCurrency(roiCalc.valuePerProject)} per project · per year`,mx+hw/2,y+33,{align:'center'});

  const ox = mx+hw+10;
  frr(ox,y,hw,40,3,[255,238,238],[208,52,52]);
  sf(7,'bold',[172,35,35]); txt('COST OF INACTION — PER MONTH',ox+hw/2,y+8.5,{align:'center'});
  sf(21,'bold',[188,36,36]); txt(formatCurrency(roiCalc.monthlyCost),ox+hw/2,y+23,{align:'center'});
  sf(7,'normal',[152,52,52]); txt('in unrealized value every month of delay',ox+hw/2,y+33,{align:'center'});
  y += 48;

  // Executive Summary
  const activeNames = activeProds.map(k=>prodLabels[k]).join(', ');
  const summaryText = `Deploying ${activeNames} across a ${numProjects}-project portfolio ($${avgProjectSizeM}M average) delivers an estimated ${formatCurrency(roiCalc.totalAnnual)} in annual value — ${formatCurrency(roiCalc.valuePerProject)} per project. Every month without Trunk Tools leaves ${formatCurrency(roiCalc.monthlyCost)} unrealized. Over 12 months, that compounds to ${formatCurrency(roiCalc.totalAnnual)} foregone — value that cannot be recovered.`;
  frr(mx,y,cw,32,3,[244,246,252]);
  sf(8,'bold',[42,56,98]); txt('Executive Summary',mx+10,y+9);
  sf(7.5,'normal',[72,88,120]);
  const wrapped = doc.splitTextToSize(summaryText, cw-22);
  doc.text(wrapped,mx+10,y+17);
  const execH = Math.max(32, wrapped.length*4.8+14);
  frr(mx,y,cw,execH,3,[244,246,252]);
  sf(8,'bold',[42,56,98]); txt('Executive Summary',mx+10,y+9);
  sf(7.5,'normal',[72,88,120]);
  doc.text(wrapped,mx+10,y+17);
  y += execH + 9;

  // Value by Solution
  if (y > H-70) { doc.addPage(); y=22; }
  sf(10.5,'bold',[12,18,44]); txt('Value by Solution',mx,y);
  sf(7.5,'normal',[112,128,158]); txt('Estimated annual value delivered per product',W-mx,y,{align:'right'});
  y += 10;
  const maxVal = Math.max(...activeProds.map(k=>roiCalc[k]?.total||0),1);
  activeProds.forEach(prod => {
    const r = roiCalc[prod]; if (!r||r.total===0) return;
    const pc = prodColors[prod]; const barW = cw*0.62;
    if (y > H-58) { doc.addPage(); y=22; }
    sf(9,'bold',pc); txt(prodLabels[prod],mx,y+5);
    sf(7,'normal',[112,128,155]); txt(prodDesc[prod],mx+52,y+5);
    sf(10,'bold',[12,20,52]); txt(formatCurrency(r.total)+'/yr',W-mx,y+5,{align:'right'});
    frr(mx,y+8,barW,8,2,[218,224,240]);
    frr(mx,y+8,Math.max(barW*(r.total/maxVal),5),8,2,pc);
    sf(7,'normal',[132,148,172]);
    let det = `${Math.round(r.hours).toLocaleString()} hrs recovered`;
    if (prod==='trunksubmittal'&&r.rework)      det += `   ·   Rework avoided: ${formatCurrency(r.rework)}`;
    if (prod==='trunkreview'&&r.changes)        det += `   ·   Missed changes caught: ${formatCurrency(r.changes)}`;
    if (prod==='trunkrfi')                       det += `   ·   ${formatNumber(p.trunkrfi?.rfisPerYear*(p.trunkrfi?.pctUnnecessary||0))} unnecessary RFIs/yr eliminated`;
    txt(det,mx,y+23); y += 30;
  });
  y += 4;

  // Value Components
  if (y > H-75) { doc.addPage(); y=22; }
  ln(mx,y,W-mx,y,[198,208,228],0.4); y += 9;
  sf(10.5,'bold',[12,18,44]); txt('Value Components',mx,y); y += 9;
  const first  = (roiCalc.trunktext?.retrieval||0)+(roiCalc.trunksubmittal?.labor||0)+(roiCalc.trunkreview?.labor||0)+(roiCalc.trunkrfi?.labor||0);
  const second = (roiCalc.trunktext?.riskAvoidance||0)+(roiCalc.trunksubmittal?.rework||0)+(roiCalc.trunkreview?.changes||0);
  const tHours = activeProds.reduce((s,k)=>s+(roiCalc[k]?.hours||0),0);

  // Table header row
  fr(mx,y-3,cw,10,[18,24,50]);
  sf(7.5,'bold',[192,208,235]);
  txt('Component',mx+4,y+3); txt('Description',mx+58,y+3); txt('Value',W-mx,y+3,{align:'right'});
  y += 10;

  const compRows = [];
  if (first>0)   compRows.push([`1st Order`, 'Labor hours recovered × loaded hourly cost', formatCurrency(first), [42,196,136]]);
  if (second>0)  compRows.push([`2nd Order`, 'Cost avoidance (rework, errors, missed changes)', formatCurrency(second), [73,159,255]]);
  compRows.push(['Hours', 'Total billable hours recovered per year', `${Math.round(tHours).toLocaleString()} hrs`, [95,112,148]]);
  compRows.forEach(([comp,desc,val,col],i) => {
    if (i%2===0) fr(mx,y-3,cw,10,[246,248,253]);
    sf(8,'bold',[62,78,115]); txt(comp,mx+4,y+3);
    sf(7.5,'normal',[68,84,118]); txt(desc,mx+58,y+3);
    sf(8.5,'bold',col); txt(val,W-mx,y+3,{align:'right'});
    y += 10;
  });
  y += 6;

  // Cost of Delay Table
  if (y > H-80) { doc.addPage(); y=22; }
  ln(mx,y,W-mx,y,[198,208,228],0.4); y += 9;
  sf(10.5,'bold',[12,18,44]); txt('Opportunity Cost of Delay',mx,y); y += 5;
  sf(7.5,'normal',[102,118,148]); txt('Value left on the table for every month Trunk Tools is not deployed:',mx,y); y += 9;
  fr(mx,y-3,cw,10,[18,24,50]);
  sf(7.5,'bold',[192,208,235]);
  txt('Delay Period',mx+4,y+3); txt('Monthly Loss',mx+55,y+3); txt('Cumulative Unrealized Value',mx+112,y+3); txt('Annual Rate',W-mx,y+3,{align:'right'});
  y += 10;
  [1,2,3,6,12].forEach((mo,i) => {
    if (i%2===0) fr(mx,y-3,cw,10,[246,248,253]);
    sf(7.5,'normal',[65,80,115]); txt(`${mo} month${mo>1?'s':''}`,mx+4,y+3);
    sf(7.5,'normal',[162,42,42]); txt(formatCurrency(roiCalc.monthlyCost),mx+55,y+3);
    sf(8.5,'bold',[162,42,42]);   txt(formatCurrency(roiCalc.monthlyCost*mo),mx+112,y+3);
    sf(7,'normal',[128,145,172]); txt(`(${formatCurrency(roiCalc.totalAnnual)}/yr)`,W-mx,y+3,{align:'right'});
    y += 10;
  });
  y += 8;

  // Key Assumptions
  if (y > H-70) { doc.addPage(); y=22; }
  ln(mx,y,W-mx,y,[198,208,228],0.4); y += 9;
  sf(10.5,'bold',[12,18,44]); txt('Key Assumptions',mx,y); y += 5;
  sf(7.5,'normal',[102,118,148]); txt('All values are fully configurable in the interactive calculator.',mx,y); y += 9;

  const p = roiInputs;
  const aRows = [['Portfolio','# of projects',numProjects.toString()],['Portfolio','Avg project size',`$${avgProjectSizeM}M`]];
  if (enabledProducts.trunktext) {
    aRows.push(['TrunkText','Field users / project',p.trunktext.fieldUsersPerProject.toString()]);
    aRows.push(['TrunkText','Searches / day / user',p.trunktext.searchesPerDay.toString()]);
    aRows.push(['TrunkText','Current search time',`${p.trunktext.currentSearchTime} min`]);
    aRows.push(['TrunkText','Loaded labor cost',`$${p.trunktext.loadedLaborCost}/hr`]);
  }
  if (enabledProducts.trunksubmittal) {
    aRows.push(['TrunkSubmittal','Submittals / year',p.trunksubmittal.submittalsPerYear.toString()]);
    aRows.push(['TrunkSubmittal','Hours / review',p.trunksubmittal.hoursPerReview.toString()]);
    aRows.push(['TrunkSubmittal','Time reduction',`${Math.round(p.trunksubmittal.timeReductionPct*100)}%`]);
    aRows.push(['TrunkSubmittal','Rework rate',`${(p.trunksubmittal.reworkRate*100).toFixed(1)}%`]);
  }
  if (enabledProducts.trunkreview) {
    aRows.push(['TrunkReview','Drawing sets / year',p.trunkreview.drawingSetsPerYear.toString()]);
    aRows.push(['TrunkReview','Hours / review',p.trunkreview.hoursPerReview.toString()]);
    aRows.push(['TrunkReview','Time reduction',`${Math.round(p.trunkreview.timeReductionPct*100)}%`]);
    aRows.push(['TrunkReview','Avg cost / missed change',`$${p.trunkreview.avgCostPerMissedChange.toLocaleString()}`]);
  }
  if (enabledProducts.trunkrfi) {
    aRows.push(['TrunkRFI','RFIs / year',p.trunkrfi.rfisPerYear.toString()]);
    aRows.push(['TrunkRFI','Hours / RFI',p.trunkrfi.hoursPerRFI.toString()]);
    aRows.push(['TrunkRFI','Time reduction (necessary RFIs)',`${Math.round(p.trunkrfi.timeReductionPct*100)}%`]);
    aRows.push(['TrunkRFI','% of RFIs unnecessary',`${Math.round(p.trunkrfi.pctUnnecessary*100)}%`]);
  }

  fr(mx,y-3,cw,10,[18,24,50]);
  sf(7.5,'bold',[192,208,235]);
  txt('Product',mx+4,y+3); txt('Assumption',mx+52,y+3); txt('Value',W-mx,y+3,{align:'right'});
  y += 10;
  aRows.forEach(([prod,key,val],i) => {
    if (y > H-22) {
      doc.addPage(); y=22;
      fr(mx,y-3,cw,10,[18,24,50]);
      sf(7.5,'bold',[192,208,235]);
      txt('Product',mx+4,y+3); txt('Assumption',mx+52,y+3); txt('Value',W-mx,y+3,{align:'right'});
      y += 10;
    }
    if (i%2===0) fr(mx,y-3,cw,10,[246,248,253]);
    sf(7,'bold',[72,88,135]); txt(prod,mx+4,y+3);
    sf(7.5,'normal',[65,80,115]); txt(key,mx+52,y+3);
    sf(7.5,'bold',[26,36,72]); txt(val,W-mx,y+3,{align:'right'});
    y += 10;
  });

  // Draw footer on every page
  const totalPages = doc.internal.getNumberOfPages();
  for (let pg=1; pg<=totalPages; pg++) { doc.setPage(pg); drawPageFooter(pg,totalPages); }

  doc.save(`${(companyName||'Trunk_Tools').replace(/[^a-zA-Z0-9]/g,'_')}_ROI_Analysis.pdf`);
};

/* ─── Main App ────────────────────────────────────────────── */
function App() {
  const init = useMemo(() => decodeState() || {
    companyName: '',
    numProjects: 10,
    avgProjectSizeM: 20,
    enabledProducts: { trunktext:true, trunksubmittal:true, trunkreview:false, trunkrfi:false },
    roiInputs: { global:{...ROI_DEFAULTS.global}, trunktext:{...ROI_DEFAULTS.trunktext}, trunksubmittal:{...ROI_DEFAULTS.trunksubmittal}, trunkreview:{...ROI_DEFAULTS.trunkreview}, trunkrfi:{...ROI_DEFAULTS.trunkrfi} }
  }, []);

  const [companyName,     setCompanyName]     = useState(init.companyName);
  const [numProjects,     setNumProjects]     = useState(init.numProjects);
  const [avgProjectSizeM, setAvgProjectSizeM] = useState(init.avgProjectSizeM);
  const [enabledProducts, setEnabledProducts] = useState(init.enabledProducts);
  const [roiInputs,       setRoiInputs]       = useState(init.roiInputs);
  const [showAdvanced,    setShowAdvanced]     = useState({ trunktext:false, trunksubmittal:false, trunkreview:false, trunkrfi:false });
  const [copied,          setCopied]           = useState(false);
  const [caseId,          setCaseId]           = useState(() => { const m=window.location.hash.match(/#case=([^&\s]+)/); return m?m[1]:null; });
  const [caseLoading,     setCaseLoading]      = useState(() => { const m=window.location.hash.match(/#case=([^&\s]+)/); return m?!localStorage.getItem(`roi_case_${m[1]}`):false; });
  const [caseSaving,      setCaseSaving]       = useState(false);
  const [casesOpen,       setCasesOpen]        = useState(false);
  const [cases,           setCases]            = useState([]);
  const [casesLoading,    setCasesLoading]     = useState(false);
  const [deletingId,      setDeletingId]       = useState(null);
  const [copiedCase,      setCopiedCase]       = useState(null);
  const saveTimerRef = useRef(null);

  const updateRoiInput = (cat, field, val) =>
    setRoiInputs(prev => ({ ...prev, [cat]:{ ...prev[cat], [field]:parseFloat(val)||0 } }));

  const toggleProduct = (k) => setEnabledProducts(prev => ({ ...prev, [k]:!prev[k] }));

  /* ── ROI Calculations ── (per project, then × numProjects) */
  const roiCalc = useMemo(() => {
    const p  = roiInputs;
    const ep = enabledProducts;
    const avgProjectValue = avgProjectSizeM * 1e6;

    // TrunkText
    const ttSearches     = p.trunktext.fieldUsersPerProject * p.trunktext.searchesPerDay * (p.trunktext.workingDaysPerYear||250);
    const ttTimeSaved    = (p.trunktext.currentSearchTime - p.trunktext.trunkTextSearchTime) / 60;
    const ttRetrievalPP  = ep.trunktext ? ttSearches * ttTimeSaved * p.trunktext.loadedLaborCost : 0;
    const ttRiskPP       = ep.trunktext && p.trunktext.riskAvoidanceEnabled
      ? ttSearches * p.trunktext.pctSearchesWithWrongInfo * p.trunktext.pctPreventedByTrunkText * p.trunktext.avgCostPerIncident : 0;
    const ttTotalPP      = ttRetrievalPP + ttRiskPP;

    // TrunkSubmittal
    const tsHrsSavedPP   = ep.trunksubmittal ? p.trunksubmittal.submittalsPerYear * p.trunksubmittal.hoursPerReview * p.trunksubmittal.timeReductionPct : 0;
    const tsLaborPP      = ep.trunksubmittal ? tsHrsSavedPP * p.trunksubmittal.reviewerCost : 0;
    const tsReworkPP     = ep.trunksubmittal ? avgProjectValue * p.trunksubmittal.reworkRate * p.trunksubmittal.pctReworkFromErrors * p.trunksubmittal.pctErrorsCaught : 0;
    const tsTotalPP      = tsLaborPP + tsReworkPP;

    // TrunkReview
    const trHrsSavedPP   = ep.trunkreview ? p.trunkreview.drawingSetsPerYear * p.trunkreview.hoursPerReview * p.trunkreview.timeReductionPct : 0;
    const trLaborPP      = ep.trunkreview ? trHrsSavedPP * p.trunkreview.reviewerCost : 0;
    const trChangesPP    = ep.trunkreview ? p.trunkreview.drawingSetsPerYear * p.trunkreview.uncloudedChangesPerSet * p.trunkreview.pctCaughtByTrunkReview * p.trunkreview.pctChangesWithCostImpact * p.trunkreview.avgCostPerMissedChange : 0;
    const trTotalPP      = trLaborPP + trChangesPP;

    // TrunkRFI — necessary RFIs: timeReductionPct saved; unnecessary RFIs: 100% saved (eliminated)
    const rfHrsSavedPP   = ep.trunkrfi ? p.trunkrfi.rfisPerYear * p.trunkrfi.hoursPerRFI *
      ((1 - p.trunkrfi.pctUnnecessary) * p.trunkrfi.timeReductionPct + p.trunkrfi.pctUnnecessary) : 0;
    const rfLaborPP      = ep.trunkrfi ? rfHrsSavedPP * p.trunkrfi.pmCost : 0;
    const rfTotalPP      = rfLaborPP;

    const valuePerProject = ttTotalPP + tsTotalPP + trTotalPP + rfTotalPP;
    const n = Math.max(numProjects, 0);

    return {
      trunktext:     { retrieval:ttRetrievalPP*n, riskAvoidance:ttRiskPP*n, total:ttTotalPP*n, hours:(ep.trunktext?ttSearches*ttTimeSaved:0)*n, labor:ttRetrievalPP*n },
      trunksubmittal:{ labor:tsLaborPP*n, rework:tsReworkPP*n, total:tsTotalPP*n, hours:tsHrsSavedPP*n },
      trunkreview:   { labor:trLaborPP*n, changes:trChangesPP*n, total:trTotalPP*n, hours:trHrsSavedPP*n },
      trunkrfi:      { labor:rfLaborPP*n, total:rfTotalPP*n, hours:rfHrsSavedPP*n },
      pp: { ttRetrieval:ttRetrievalPP, ttRisk:ttRiskPP, tsLabor:tsLaborPP, tsRework:tsReworkPP, trLabor:trLaborPP, trChanges:trChangesPP, rfLabor:rfLaborPP, ttSearches, ttTimeSaved, tsHrsSaved:tsHrsSavedPP, trHrsSaved:trHrsSavedPP, rfHrsSaved:rfHrsSavedPP },
      valuePerProject,
      totalAnnual:   valuePerProject * n,
      monthlyCost:   (valuePerProject * n) / 12,
      totalHours:    ((ep.trunktext?ttSearches*ttTimeSaved:0) + tsHrsSavedPP + trHrsSavedPP + rfHrsSavedPP) * n
    };
  }, [roiInputs, enabledProducts, numProjects, avgProjectSizeM]);

  const p  = roiInputs;
  const ep = enabledProducts;
  const c  = roiCalc;
  const pp = c.pp;
  const activeCount = [ep.trunktext, ep.trunksubmittal, ep.trunkreview, ep.trunkrfi].filter(Boolean).length;

  const state = useMemo(() => ({ companyName, numProjects, avgProjectSizeM, enabledProducts, roiInputs }), [companyName, numProjects, avgProjectSizeM, enabledProducts, roiInputs]);

  // Auto-save: keep URL hash in sync (skipped in case mode — URL stays as #case=<id>)
  useEffect(() => {
    if (window.location.hash.startsWith('#case=')) return;
    try {
      const payload = { co:state.companyName, n:state.numProjects, a:state.avgProjectSizeM, p:state.enabledProducts, ri:state.roiInputs };
      history.replaceState(null, '', `#s=${btoa(JSON.stringify(payload))}`);
    } catch {}
  }, [state]);

  // Case: load state from JSONBin on mount (cache-first for instant load)
  useEffect(() => {
    const m = window.location.hash.match(/#case=([^&\s]+)/);
    if (!m) return;
    const id = m[1];
    const applyRec = (rec) => {
      if (rec.companyName     !== undefined) setCompanyName(rec.companyName);
      if (rec.numProjects     !== undefined) setNumProjects(rec.numProjects);
      if (rec.avgProjectSizeM !== undefined) setAvgProjectSizeM(rec.avgProjectSizeM);
      if (rec.enabledProducts)               setEnabledProducts(ep=>({...ep,...rec.enabledProducts}));
      if (rec.roiInputs)                     setRoiInputs({
        global:        {...ROI_DEFAULTS.global,        ...(rec.roiInputs.global||{})},
        trunktext:     {...ROI_DEFAULTS.trunktext,     ...(rec.roiInputs.trunktext||{})},
        trunksubmittal:{...ROI_DEFAULTS.trunksubmittal,...(rec.roiInputs.trunksubmittal||{})},
        trunkreview:   {...ROI_DEFAULTS.trunkreview,   ...(rec.roiInputs.trunkreview||{})},
        trunkrfi:      {...ROI_DEFAULTS.trunkrfi,      ...(rec.roiInputs.trunkrfi||{})}
      });
    };
    // Populate from cache instantly if available (no overlay)
    const cached = localStorage.getItem(`roi_case_${id}`);
    if (cached) { try { applyRec(JSON.parse(cached)); setCaseLoading(false); } catch {} }
    // Always fetch from JSONBin to get latest (syncs changes from other devices)
    fetch(`${JBIN_API}/${id}/latest`, { headers:{'X-Master-Key':JBIN_KEY} })
      .then(r=>r.json())
      .then(d => { applyRec(d.record); localStorage.setItem(`roi_case_${id}`, JSON.stringify(d.record)); })
      .catch(e=>console.error('Failed to load ROI case:',e))
      .finally(()=>setCaseLoading(false));
  }, []);

  // Load cases when panel is opened
  useEffect(() => { if (casesOpen) loadCases(); }, [casesOpen]);

  // Case: debounced auto-save to JSONBin on every state change
  useEffect(() => {
    if (!caseId || caseLoading) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      setCaseSaving(true);
      fetch(`${JBIN_API}/${caseId}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':JBIN_KEY},
        body: JSON.stringify(state)
      }).then(()=>localStorage.setItem(`roi_case_${caseId}`, JSON.stringify(state)))
        .finally(()=>setCaseSaving(false));
    }, 2000);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [state, caseId, caseLoading]);

  // Source of truth = the bins themselves. We list every bin on the account
  // (paginated, 10 at a time, newest first) and treat each non-index bin as a
  // case. No separate index to drift out of sync. JBIN_COLL endpoint returns
  // {record:<binId>, snippetMeta:{name}, createdAt}.
  const loadCases = async () => {
    setCasesLoading(true);
    try {
      let all = [], url = JBIN_COLL;
      while (true) {
        const r = await fetch(url, { headers:{'X-Master-Key':JBIN_KEY} });
        const page = await r.json();
        if (!Array.isArray(page) || page.length === 0) break;
        all = all.concat(page);
        if (page.length < 10) break;                 // last page
        url = `${JBIN_COLL}/${page[page.length-1].record}`; // next page cursor
      }
      setCases(all
        .filter(b => b.record !== JBIN_INDEX)         // skip the legacy index bin
        .map(b => ({ id: b.record, name: b.snippetMeta?.name || 'ROI Case', createdAt: b.createdAt }))
      ); // API already returns newest-first
    } catch(e) { console.error('Failed to load cases:', e); }
    setCasesLoading(false);
  };

  const deleteCase = async (id, name) => {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    setDeletingId(id);
    try {
      await fetch(`${JBIN_API}/${id}`, { method:'DELETE', headers:{'X-Master-Key':JBIN_KEY} });
      setCases(prev => prev.filter(c => c.id !== id));
      localStorage.removeItem(`roi_case_${id}`);
    } catch(e) { console.error('Failed to delete case:', e); }
    setDeletingId(null);
  };

  const createCase = async () => {
    setCaseLoading(true);
    try {
      const res = await fetch(JBIN_API, {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':JBIN_KEY,'X-Bin-Name':companyName.trim()||'ROI Case'},
        body: JSON.stringify(state)
      });
      const data = await res.json();
      const id = data.metadata.id;
      setCaseId(id);
      history.replaceState(null, '', `#case=${id}`);
      localStorage.setItem(`roi_case_${id}`, JSON.stringify(state));
      // No index to update — the new bin (named via X-Bin-Name above) shows up
      // automatically next time the Saved Cases panel lists bins.
    } catch(e) { console.error('Failed to create ROI case:',e); }
    setCaseLoading(false);
  };

  const handleCopyLink = () => {
    navigator.clipboard.writeText(`${DEPLOY_URL}#case=${caseId}`).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false),2600);
    });
  };

  const handleShare = () => {
    const link = encodeState(state);
    navigator.clipboard.writeText(link).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2600);
    });
  };

  const handleDownload = () => generatePDF(companyName, numProjects, avgProjectSizeM, roiCalc, roiInputs, enabledProducts);

  const shareWarning = !DEPLOY_URL && window.location.protocol === 'file:';

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>

      {/* ── Header ── */}
      <header style={{ background:'var(--bg-surface)', borderBottom:'1px solid var(--border)', padding:'0 40px', height:60, display:'flex', alignItems:'center', justifyContent:'space-between', position:'sticky', top:0, zIndex:100, flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <div style={{ width:36, height:36, borderRadius:10, background:'var(--accent)', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 14px var(--accent-glow)' }}>
            <span style={{ fontSize:18, fontWeight:800, color:'var(--accent-text)', lineHeight:1 }}>T</span>
          </div>
          <div>
            <div style={{ fontSize:15, fontWeight:700, color:'var(--text-primary)', letterSpacing:'-0.01em', lineHeight:1.2 }}>Trunk Tools</div>
            <div style={{ fontSize:9.5, color:'var(--text-muted)', fontFamily:'var(--font-mono)', letterSpacing:'0.08em' }}>ROI CALCULATOR</div>
          </div>
        </div>

        <div style={{ flex:1, maxWidth:480, margin:'0 24px', display:'flex', gap:8, alignItems:'center' }}>
          {!caseId ? (
            <>
              <input type="text" value={companyName} onChange={e=>setCompanyName(e.target.value)} placeholder="Company name..."
                style={{ flex:1, padding:'8px 14px', borderRadius:'var(--radius-md)', border:'1px solid var(--border)', background:'var(--bg-input)', color:'var(--text-primary)', fontSize:13, outline:'none', transition:'border-color var(--transition)' }}
                onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              {companyName.trim() && (
                <button onClick={createCase} disabled={caseLoading}
                  style={{ padding:'8px 16px', borderRadius:'var(--radius-md)', border:'none', background:'var(--accent)', color:'var(--accent-text)', fontSize:13, fontWeight:700, cursor:caseLoading?'wait':'pointer', whiteSpace:'nowrap', flexShrink:0, opacity:caseLoading?0.7:1, transition:'opacity var(--transition)' }}>
                  {caseLoading ? 'Creating…' : '+ Create ROI Case'}
                </button>
              )}
            </>
          ) : (
            <div style={{ display:'flex', alignItems:'center', gap:10, flex:1, background:'var(--bg-elevated)', borderRadius:'var(--radius-md)', border:'1px solid var(--border)', padding:'7px 14px' }}>
              <div style={{ width:8, height:8, borderRadius:'50%', flexShrink:0, background:caseLoading?'var(--cyan)':caseSaving?'var(--yellow)':'#4aedb5', boxShadow:caseLoading?'none':caseSaving?'none':'0 0 6px rgba(74,237,181,0.6)', animation:caseLoading?'spin 1.2s linear infinite':'none', transition:'all 0.4s' }}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:700, color:'var(--text-primary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{companyName?`${companyName} ROI Case`:'ROI Case'}</div>
                <div style={{ fontSize:10, color:'var(--text-muted)', fontFamily:'var(--font-mono)' }}>{caseLoading?'Loading model…':caseSaving?'Saving…':'Live · auto-saves for all viewers'}</div>
              </div>
              <button onClick={handleCopyLink}

                          <InfoTooltip text="Two components added together, then × # of projects. 1st order: drawing sets/year × hrs/review × time reduction % × reviewer cost (labor saved from automated comparison). 2nd order: drawing sets × unclouded changes/set × % caught by TrunkReview × % with cost impact × avg cost per missed change. Unclouded changes are real drawing revisions the EOR didn't mark — the most dangerous kind."/>
                        </span>
                        <span style={{ fontSize:11, fontFamily:'var(--font-mono)', color:'var(--text-primary)', fontWeight:600 }}>{formatCurrency(c.trunkreview.total)}<span style={{ color:'var(--text-muted)', fontWeight:400 }}>/yr</span></span>
                      </div>
                    )}
                    {ep.trunkrfi && c.trunkrfi.total > 0 && (
                      <div style={{ display:'flex', justifyContent:'space-between', padding:'5px 10px', background:'var(--cyan-muted)', borderRadius:'var(--radius-sm)', border:'1px solid rgba(34,211,238,0.2)' }}>
                        <span style={{ fontSize:11, fontWeight:600, color:'var(--cyan)', fontFamily:'var(--font-mono)', display:'flex', alignItems:'center' }}>
                          TrunkRFI
                          <InfoTooltip text="Labor savings from two sources, then × # of projects. Necessary RFIs: rfisPerYear × (1 − % unnecessary) × hrs/RFI × time reduction % × PM cost. Unnecessary RFIs (already answerable from docs): rfisPerYear × % unnecessary × hrs/RFI × 100% × PM cost — these are fully eliminated so the full hour is saved. Both feed into 1st Order labor."/>
                        </span>
                        <span style={{ fontSize:11, fontFamily:'var(--font-mono)', color:'var(--text-primary)', fontWeight:600 }}>{formatCurrency(c.trunkrfi.total)}<span style={{ color:'var(--text-muted)', fontWeight:400 }}>/yr</span></span>
                      </div>
                    )}
                  </div>

                  <div style={{ marginTop:12, paddingTop:12, borderTop:'2px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <div>
                      <div style={{ fontSize:10, color:'var(--text-muted)', marginBottom:2, display:'flex', alignItems:'center' }}>
                        Total Annual Value
                        <InfoTooltip text="Sum of all active products' annual value across your entire portfolio. Formula: per-project value × # of projects. Change the # of Projects input at the top to instantly scale this up or down."/>
                      </div>
                      <div style={{ fontSize:10, color:'var(--text-muted)', display:'flex', alignItems:'center' }}>
                        {formatCurrency(c.valuePerProject)} / project
                        <InfoTooltip text="What one average project delivers. Based on your avg project size and the assumption rates in the left panel. Multiply this by any number of projects to model a different portfolio size — that's exactly what the # of Projects input does."/>
                      </div>
                    </div>
                    <div style={{ fontSize:30, fontWeight:700, color:'var(--green)', fontFamily:'var(--font-mono)', letterSpacing:'-0.02em' }}>{formatCurrency(c.totalAnnual)}</div>
                  </div>
                </div>

                {/* Cost of Doing Nothing */}
                <div style={{ background:'linear-gradient(135deg,rgba(255,112,112,0.1),rgba(255,112,112,0.04))', border:'1.5px solid rgba(255,112,112,0.35)', borderRadius:'var(--radius-lg)', padding:24, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:8 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:'var(--red)', textTransform:'uppercase', letterSpacing:'0.1em', display:'flex', alignItems:'center', gap:5 }}>
                    Cost of Doing Nothing
                    <InfoTooltip text="Total Annual Value ÷ 12. Not a fee — it's opportunity cost. Every month without Trunk Tools, this is the value your portfolio could have captured but didn't. It compounds linearly: 3 months = 3× this number, 6 months = 6×, 12 months = the full annual figure above."/>
                  </div>
                  <div style={{ fontSize:11, color:'var(--red)', opacity:0.75 }}>per month of inaction</div>
                  <div style={{ fontSize:48, fontWeight:700, color:'var(--red)', fontFamily:'var(--font-mono)', letterSpacing:'-0.03em', lineHeight:1, margin:'8px 0' }}>
                    {formatCurrency(c.monthlyCost)}
                  </div>
                  <div style={{ fontSize:12, color:'var(--text-muted)', lineHeight:1.6, maxWidth:280 }}>
                    In unrealized value every month you wait — equal to <span style={{ color:'var(--text-secondary)', fontWeight:600 }}>{formatCurrency(c.totalAnnual)}</span> per year left on the table.
                  </div>
                  <div style={{ marginTop:6, padding:'7px 18px', background:'rgba(255,112,112,0.1)', border:'1px solid rgba(255,112,112,0.2)', borderRadius:'var(--radius-xl)', fontSize:12, fontFamily:'var(--font-mono)', color:'var(--red)' }}>
                    {formatCurrency(c.monthlyCost * 3)} / quarter &nbsp;·&nbsp; {formatCurrency(c.totalAnnual)} / year
                  </div>
                </div>

                {/* Saved Cases */}
                <div style={{ border:'1px solid var(--border)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}>
                  <button onClick={() => setCasesOpen(o => !o)}
                    style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', background:'var(--bg-elevated)', border:'none', cursor:'pointer', color:'var(--text-primary)' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ fontSize:13 }}>📁</span>
                      <span style={{ fontSize:13, fontWeight:600 }}>Saved Cases</span>
                    </div>
                    <span style={{ fontSize:10, color:'var(--text-muted)', fontFamily:'var(--font-mono)', display:'inline-block', transform:casesOpen?'rotate(180deg)':'none', transition:'transform var(--transition)' }}>▼</span>
                  </button>
                  {casesOpen && (
                    <div style={{ background:'var(--bg-card)' }}>
                      {casesLoading ? (
                        <div style={{ padding:'16px', textAlign:'center', color:'var(--text-muted)', fontSize:12 }}>Loading…</div>
                      ) : cases.length === 0 ? (
                        <div style={{ padding:'16px', textAlign:'center', color:'var(--text-muted)', fontSize:12 }}>No saved cases yet</div>
                      ) : cases.map((entry, i) => (
                        <div key={entry.id} style={{ display:'flex', alignItems:'center', padding:'9px 12px', gap:7, borderTop: i===0?'none':'1px solid var(--border-light)' }}>
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontSize:12, fontWeight:600, color:'var(--text-primary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{entry.name}</div>
                            <div style={{ fontSize:10, color:'var(--text-muted)', fontFamily:'var(--font-mono)' }}>{new Date(entry.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
                          </div>
                          <button onClick={() => { navigator.clipboard.writeText(`${DEPLOY_URL}#case=${entry.id}`); setCopiedCase(entry.id); setTimeout(()=>setCopiedCase(null),2000); }}
                            title="Copy link"
                            style={{ padding:'4px 8px', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)', background:'var(--bg-elevated)', color:copiedCase===entry.id?'var(--green)':'var(--text-muted)', fontSize:11, cursor:'pointer', flexShrink:0, transition:'color var(--transition)' }}>
                            {copiedCase===entry.id?'✓':'⎘'}
                          </button>
                          <button onClick={() => window.open(`${DEPLOY_URL}#case=${entry.id}`, '_blank')}
                            title="Open case"
                            style={{ padding:'4px 8px', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)', background:'var(--bg-elevated)', color:'var(--text-muted)', fontSize:11, cursor:'pointer', flexShrink:0 }}>
                            Open
                          </button>
                          <button onClick={() => deleteCase(entry.id, entry.name)}
                            disabled={deletingId===entry.id}
                            title="Delete case"
                            style={{ padding:'4px 8px', borderRadius:'var(--radius-sm)', border:'1px solid rgba(255,112,112,0.3)', background:'rgba(255,112,112,0.07)', color:'var(--red)', fontSize:11, cursor:deletingId===entry.id?'wait':'pointer', flexShrink:0, opacity:deletingId===entry.id?0.4:1 }}>
                            {deletingId===entry.id?'…':'✕'}
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}
          </div>

        </div>
      </main>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
